spring.application.name=meet-minutes-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Whisper configuration
whisper.directory=${WHISPER_DIRECTORY:C:/Users/godha/Desktop/MeetMinutes/backend/meet-minutes-backend/tools/whisper}
whisper.executable=${WHISPER_EXECUTABLE:C:/Users/godha/Desktop/MeetMinutes/backend/meet-minutes-backend/tools/whisper/whisper-cli.exe}
whisper.model=${WHISPER_MODEL:C:/Users/godha/Desktop/MeetMinutes/backend/meet-minutes-backend/tools/whisper/models/ggml-small.bin}

# Gemini AI configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}